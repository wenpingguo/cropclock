name: cropclock

services:
  db:
    image: postgres:17-alpine
    container_name: cropclock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cropclock
      POSTGRES_PASSWORD: cropclock
      POSTGRES_DB: cropclock
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cropclock-db:/var/lib/postgresql/data

volumes:
  cropclock-db:
